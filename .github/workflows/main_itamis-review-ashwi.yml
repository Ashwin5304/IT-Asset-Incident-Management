
name: Build and deploy Python app to Azure Web App - itamis-review-ashwi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: IT-Asset-Incident-Management

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            IT-Asset-Incident-Management/
            !IT-Asset-Incident-Management/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4C4E45D3909041F2BA3AF6BAF5E3FE01 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_54CC06EA122643E396FF3CE92EE2BBC0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BDE3AB3FBC584F8884EA9345FDFBFBD1 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: itamis-review-ashwi
          slot-name: Production
